<body>
  <h1>שלום, אני אפרת-יערה חטב</h1>

  <h2>קצת עליי</h2>
  <p>מלווה נשים שיודעות מה נכון להן, 
אבל פחד לאכזב, אשמה וריצוי 
גורמים להן לשתוק, לדחות ולהישאר במקום.
עוזרת להן להבין מה באמת עוצר אותן, 
לבחור בעצמן בלי להילחם בעצמן, 
ולעשות צעד אמיתי קדימה.</p>

  <h2>התחביבים שלי</h2>
  <ul>
    <li>ספורט</li>
    <li>שיחות עומק</li>
    <li>חדרי בריחה</li>
  </ul>

</body>
